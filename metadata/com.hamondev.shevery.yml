Summary: System service manager with ADB & Dhizuku support
Description: |-
  Shevery is an enhanced Android system service manager featuring Material 3 Expressive UI,
  experimental Dhizuku integration, ADB Modules management, and Comput AI command assistance.

  Features:
  - Jetpack Compose UI with Material 3 Expressive components.
  - ADB Modules installer and manager for system shell scripts.
  - Experimental Dhizuku Device-Owner bridging integration.
  - Comput Console for executing custom commands and shell scripts.

