name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --channel=3 --licenses > /dev/null || true

      - name: Build APK
        run: ./gradlew :manager:assemble

      - name: List build outputs
        run: |
          echo "=== manager/build/outputs/apk ==="
          find manager/build/outputs/apk -name "*.apk" 2>/dev/null || echo "not found"
          echo "=== out/apk ==="
          find out/apk -name "*.apk" 2>/dev/null || echo "out/apk not found"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shevery-apk
          path: |
            manager/build/outputs/apk/*/*.apk
            out/apk/*.apk
          compression-level: 9
          if-no-files-found: warn
          
